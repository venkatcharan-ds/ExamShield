name: Finalize real candidate dashboard

on:
  push:
    branches: [fix/multi-user-isolation]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'finalize real candidate dashboard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multi-user-isolation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply dashboard cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/app/dashboard/page.tsx')
          s=p.read_text()
          orig=s
          s=s.replace("import type { CandidateSession, TimelineEvent, DemoScenario } from '@/types'", "import type { CandidateSession, TimelineEvent } from '@/types'")
          s=s.replace("import {\n  SCENARIOS, buildInitialSession,\n  getRiskColor, getRiskLabel, getRiskLevel, getScenarioMeta,\n} from '@/services/demoScenarios'", "import { getRiskColor, getRiskLabel, getRiskLevel } from '@/services/demoScenarios'\nimport { createClient } from '@/lib/supabase/client'")
          start=s.find('/* ─── Demo Controls'); end=s.find('/* ─── Integrity Index', start); assert start>=0 and end>start
          s=s[:start]+s[end:]
          start=s.find('/* ─── Institution Summary'); end=s.find('/* ─── Risk Chart', start); assert start>=0 and end>start
          s=s[:start]+s[end:]
          s=s.replace("  const [activeScenario, setActiveScenario] = useState<DemoScenario | null>(null)\n  const [isRunning,      setIsRunning]      = useState(false)\n", "")
          s=s.replace("  const timeoutsRef  = useRef<ReturnType<typeof setTimeout>[]>([])\n", "")
          start=s.find('  /* Demo runner */'); end=s.find('  /* Derived */', start); assert start>=0 and end>start
          s=s[:start]+s[end:]
          s=s.replace("  /* Demo-scenario sessions are client-side simulations (session_id: `demo-*`) — never real candidate data */\n  const isDemoSession = session?.session_id?.startsWith('demo-') ?? false\n", "")
          old='''    const base = process.env.NEXT_PUBLIC_WS_URL ?? "wss://examshield-api-production-1e2c.up.railway.app"\n    const url  = `${toWsUrl(base)}/ws-dashboard`\n    let ws: WebSocket, timer: ReturnType<typeof setTimeout>, attempts = 0\n\n    const connect = () => {\n      try {\n        ws = new WebSocket(url)'''
          new='''    const base = process.env.NEXT_PUBLIC_WS_URL ?? process.env.NEXT_PUBLIC_API_URL ?? "http://localhost:8000"\n    let ws: WebSocket, timer: ReturnType<typeof setTimeout>, attempts = 0\n\n    const connect = async () => {\n      try {\n        const { data } = await createClient().auth.getSession()\n        const token = data.session?.access_token\n        if (!token) { setWsConnected(false); return }\n        const url = `${toWsUrl(base)}/ws-dashboard?token=${encodeURIComponent(token)}`\n        ws = new WebSocket(url)'''
          assert old in s; s=s.replace(old,new)
          s=s.replace("      } catch { /* demo-only mode */ }", "      } catch { setWsConnected(false) }")
          start=s.find('            {/* Demo controls */}'); end=s.find('            {/* Timeline */}', start); assert start>=0 and end>start
          s=s[:start]+s[end:]
          s=s.replace("\n        {/* Institution Summary */}\n        <InstitutionSummary />", "")
          s=s.replace('Run a demo scenario →', 'Waiting for a candidate exam session…')
          s=s.replace('Run a scenario to see events', 'Waiting for candidate activity…')
          s=s.replace('Run a scenario to generate the analysis report.', 'Start a real exam session to generate the analysis report.')
          s=s.replace('Run a scenario to see the trend', 'Start a real exam session to see the trend')
          s=s.replace('Run a scenario to calculate', 'Start a real exam session to calculate')
          old='''              style={isDemoSession\n                ? { background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.35)' }\n                : { background: 'var(--surface-2)', border: '1px solid var(--border-0)' }}>\n              {isDemoSession ? (\n                <>\n                  <AlertTriangle className="w-3 h-3" style={{ color: '#F59E0B' }} />\n                  <span className="text-[11px] font-bold tracking-wide" style={{ color: '#FCD34D' }}>SIMULATION MODE</span>\n                </>\n              ) : wsConnected ? ('''
          new='''              style={{ background: 'var(--surface-2)', border: '1px solid var(--border-0)' }}>\n              {wsConnected ? ('''
          assert old in s; s=s.replace(old,new)
          s=s.replace("<span className=\"text-[11px]\" style={{ color: 'var(--text-3)' }}>Demo mode</span>", "<span className=\"text-[11px]\" style={{ color: 'var(--text-3)' }}>Waiting</span>")
          s=re.sub(r"\n\s*\{isDemoSession && \(.*?\n\s*\)\}", "", s, flags=re.S)
          for forbidden in ['DemoControls','SCENARIOS','buildInitialSession','DemoScenario','INST_DATA','InstitutionSummary','isDemoSession','runScenario','Testing &amp; Simulation','SIMULATION MODE']:
              assert forbidden not in s, forbidden
          assert 'ws-dashboard?token=' in s
          assert len(s)<len(orig)
          p.write_text(s)
          PY
          cd frontend
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm run build

      - name: Commit cleaned dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/dashboard/page.tsx
          git commit -m 'fix: finalize real candidate dashboard'
          git push origin fix/multi-user-isolation
